# Maintained by hand: .github/ is listed in .fernignore, so regeneration keeps this file instead of
# Fern's generated workflow. When upgrading the Go generator, check whether its build steps changed.
name: ci

on: [push]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Compile
        run: go build ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup wiremock server
        run: |
          PROJECT_NAME="wiremock-$(basename "$(dirname "$PWD")" | tr -d '.')"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
          if [ -f wiremock/docker-compose.test.yml ]; then
            docker compose -p "$PROJECT_NAME" -f wiremock/docker-compose.test.yml down
            docker compose -p "$PROJECT_NAME" -f wiremock/docker-compose.test.yml up -d
            WIREMOCK_PORT=$(docker compose -p "$PROJECT_NAME" -f wiremock/docker-compose.test.yml port wiremock 8080 | cut -d: -f2)
            echo "WIREMOCK_URL=http://localhost:$WIREMOCK_PORT" >> "$GITHUB_ENV"
          fi

      - name: Test
        run: go test ./...

      - name: Teardown wiremock server
        if: always()
        run: |
          if [ -f wiremock/docker-compose.test.yml ]; then
            docker compose -p "$PROJECT_NAME" -f wiremock/docker-compose.test.yml down
          fi
